name: Publish Docker Image

on:
  push:
    branches: ['main', 'beta']
    tags: ['v*']
  workflow_dispatch:

env:
  GH_REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Verify Playwright Docker image matches lockfile
        shell: bash
        run: |
          set -euo pipefail
          LOCKED_PLAYWRIGHT_VERSION="$(node -p "require('./package-lock.json').packages['node_modules/playwright'].version")"
          DOCKER_PLAYWRIGHT_VERSION="$(sed -nE 's#^FROM mcr\.microsoft\.com/playwright:v([0-9]+\.[0-9]+\.[0-9]+)-jammy AS runtime$#\1#p' Dockerfile)"

          if [ -z "$DOCKER_PLAYWRIGHT_VERSION" ]; then
            echo "Could not determine Playwright version from Dockerfile runtime image."
            exit 1
          fi

          if [ "$LOCKED_PLAYWRIGHT_VERSION" != "$DOCKER_PLAYWRIGHT_VERSION" ]; then
            echo "Playwright version mismatch: package-lock.json=$LOCKED_PLAYWRIGHT_VERSION Dockerfile=$DOCKER_PLAYWRIGHT_VERSION"
            exit 1
          fi

          echo "Playwright versions match: $LOCKED_PLAYWRIGHT_VERSION"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GH_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build tags exclusively for GHCR
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=beta,enable=${{ github.ref == 'refs/heads/beta' }}
            type=ref,event=tag
            type=semver,pattern={{version}}
            # Any other branch (e.g. manual workflow_dispatch runs): tag by branch name
            type=ref,event=branch,enable=${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/beta' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
