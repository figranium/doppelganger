services:
  figranium:
    build: .
    # By default, Docker Compose uses the host's architecture.
    # This ensures ARM devices (like Apple Silicon) use the linux/arm64 images
    # provided by the base images in the Dockerfile.
    ports:
      - "11345:11345" # Main application
      - "54311:54311" # VNC / noVNC
    environment:
      - NODE_ENV=production
    volumes:
      - ./data:/app/data
      # Persist captures on the host and make them visible in the repo's captures
      # folder. Both container paths are mounted to the same host dir because the
      # agent writes to src/public/captures while scrape.js writes to public/captures.
      - ./src/public/captures:/app/public/captures
      - ./src/public/captures:/app/src/public/captures
    restart: unless-stopped
