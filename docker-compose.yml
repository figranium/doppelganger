services:
  figranium:
    build: .
    # By default, Docker Compose uses the host's architecture.
    # This ensures ARM devices (like Apple Silicon) use the linux/arm64 images
    # provided by the base images in the Dockerfile.
    ports:
      - "11345:11345" # Main application
      - "54311:54311" # VNC / noVNC
    environment:
      - NODE_ENV=production
      # Browser engine: Playwright + stealth plugin by default. Uncomment the
      # lines below to run CloakBrowser's stealth-patched Chromium instead.
      # - USE_CLOAK_ENGINE=true
      # - CLOAKBROWSER_LICENSE_KEY=cb_xxxxxxxx
      # Captcha solving (`solve_captcha` agent action): an embedded ohmycaptcha
      # instance runs inside this container by default. Point at an external
      # instance instead by uncommenting these:
      # - OHMYCAPTCHA_URL=http://your-host:8000
      # - OHMYCAPTCHA_CLIENT_KEY=your-client-key
      # reCAPTCHA v2's audio-challenge fallback (used whenever the click-only solve
      # isn't enough — common for headless/datacenter traffic) needs an OpenAI-compatible
      # API key configured, or it always fails with ERROR_CAPTCHA_UNSOLVABLE. Without this,
      # only challenges solvable without the fallback (and hCaptcha/Turnstile/v3) will work.
      # - CLOUD_API_KEY=sk-xxxxxxxx
      # - CLOUD_BASE_URL=https://api.openai.com/v1
      # - CLOUD_MODEL=gpt-4o-audio-preview
    volumes:
      - ./data:/app/data
      # Persist captures on the host and make them visible in the repo's captures
      # folder. Both container paths are mounted to the same host dir because the
      # agent writes to src/public/captures while scrape.js writes to public/captures.
      - ./src/public/captures:/app/public/captures
      - ./src/public/captures:/app/src/public/captures
    restart: unless-stopped
