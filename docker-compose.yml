services:
  figranium:
    build: .
    # By default, Docker Compose uses the host's architecture.
    # This ensures ARM devices (like Apple Silicon) use the linux/arm64 images
    # provided by the base images in the Dockerfile.
    ports:
      - "11345:11345" # Main application
      - "54311:54311" # VNC / noVNC
    environment:
      - NODE_ENV=production
      # Browser engine: Playwright + stealth plugin by default. Uncomment the
      # lines below to run CloakBrowser's stealth-patched Chromium instead.
      # - USE_CLOAK_ENGINE=true
      # - CLOAKBROWSER_LICENSE_KEY=cb_xxxxxxxx
      # Optional YesCaptcha/AntiCaptcha-compatible service. It is tried before
      # the active-browser local solver.
      # - CAPTCHA_SOLVER_URL=https://solver.example.com
      # - CAPTCHA_SOLVER_KEY=your-client-key
      # Local weights are downloaded into /app/data/captcha-model, never the image.
      # - CAPTCHA_MODEL_TIER=auto # auto|owlvit|florence2
      # - CAPTCHA_MODEL_DEVICE=auto # auto|cpu
      # - SKIP_LOCAL_CAPTCHA_MODEL=true
      # Sensitive remote identity forwarding is always opt-in.
      # - CAPTCHA_REMOTE_FORWARD_PROXY=true
      # - CAPTCHA_REMOTE_FORWARD_CONTEXT=true
      # - CAPTCHA_REMOTE_TIMEOUT_MS=45000
      # - CAPTCHA_LOCAL_FALLBACK_MIN_MS=15000
      # Optional Apple companion (run npm run captcha:companion:start:docker on host).
      # - CAPTCHA_COMPANION_URL=http://host.docker.internal:11438
      # CAPTCHA_COMPANION_TOKEN can be set explicitly; by default the shared
      # /app/data/captcha-companion-token file is read.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/app/data
      # Persist captures on the host and make them visible in the repo's captures
      # folder. Both container paths are mounted to the same host dir because the
      # agent writes to src/public/captures while scrape.js writes to public/captures.
      - ./src/public/captures:/app/public/captures
      - ./src/public/captures:/app/src/public/captures
    restart: unless-stopped
