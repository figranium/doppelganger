<!DOCTYPE html>
<html lang="en" class="h-full">

<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="public/favicon.svg" />
    <link rel="shortcut icon" href="public/favicon.svg" />
    <link rel="apple-touch-icon" href="public/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Figranium | Build complex browser workflows visually</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Questrial&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap"
        rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
        rel="stylesheet" />
    <link rel="stylesheet" href="/editor-ui.css" />
    <script>
        (function() {
            try {
                var theme = 'dark';
                var cookies = document.cookie ? document.cookie.split(';') : [];
                for (var i = 0; i < cookies.length; i++) {
                    var c = cookies[i].trim();
                    if (c.indexOf('figranium_theme=') === 0 || c.indexOf('theme=') === 0) {
                        var val = c.substring(c.indexOf('=') + 1).trim();
                        if (['dark', 'light', 'solarized-light', 'solarized-dark'].indexOf(val) !== -1) {
                            theme = val;
                            break;
                        }
                    }
                }
                if (theme === 'dark' && localStorage) {
                    var local = localStorage.getItem('figranium.theme');
                    if (local && ['dark', 'light', 'solarized-light', 'solarized-dark'].indexOf(local) !== -1) {
                        theme = local;
                    }
                }
                document.documentElement.setAttribute('data-theme', theme);
            } catch (e) {}
        })();
    </script>
</head>

<body class="bg-[#020202] text-gray-100 font-sans h-full overflow-hidden selection:bg-white selection:text-black">
    <div id="root" class="h-full"></div>
    <script src="/new-task-execution-config.js"></script>
    <script type="module" src="/src/main.tsx"></script>
</body>

</html>
